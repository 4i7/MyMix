name: Repair MyMix v1 release metadata

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-v1-release.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: self-hosted
    steps:
      - name: Repair published v1.0.0 metadata and remove stale draft
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'v1.0.0';

            const markerResponse = await github.rest.repos.getContent({ owner, repo, path: '.mymix-converted', ref: 'main' });
            if (Array.isArray(markerResponse.data) || !markerResponse.data.content) throw new Error('.mymix-converted could not be read.');
            const marker = Buffer.from(markerResponse.data.content, 'base64').toString('utf8');
            const upstream = marker.match(/^upstream=File-New-Project\/EarTrumpet@([0-9a-f]{40})$/m);
            if (!upstream) throw new Error('Recorded EarTrumpet upstream SHA was not found.');

            const published = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            if (published.draft) throw new Error('v1.0.0 is not published yet.');
            const body = [
              'MyMix is an independent, unofficial derivative of EarTrumpet.',
              '',
              `EarTrumpet upstream: \`${upstream[1]}\``,
              'Build: standalone Windows x86 / .NET Framework 4.6.2 target',
              'Privacy: no automatic telemetry, crash-report upload, or feedback upload',
              '',
              '**Unsigned binary:** Windows may show an unknown-publisher or SmartScreen warning.',
              'Verify `MyMix-x86.zip` against `SHA256SUMS.txt` from this release before running it.',
              '',
              'See the bundled `LICENSE`, `THIRD_PARTY_NOTICES.md`, and `PRIVACY.md` before redistribution or diagnostic sharing.'
            ].join('\n');
            await github.rest.repos.updateRelease({ owner, repo, release_id: published.id, name: 'MyMix 1.0.0', body, draft: false, prerelease: false });

            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            for (const release of releases) {
              if (release.id !== published.id && release.draft && release.tag_name === tag) {
                await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
                core.info(`Deleted stale draft release ${release.id}.`);
              }
            }
            core.info(`Updated ${tag} with EarTrumpet upstream ${upstream[1]}.`);
