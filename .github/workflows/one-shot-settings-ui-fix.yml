name: One-shot settings UI source repair

on:
  push:
    branches:
      - fix/settings-display-labels

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Wire deterministic settings repair stage
        shell: powershell
        run: |
          $path = '.\tools\Optimize-MyMix.ps1'
          $text = [IO.File]::ReadAllText($path)
          $anchor = ". (Resolve-RepoPath 'tools/Optimize-MyMix/17-startup-option.ps1')"
          $stage = ". (Resolve-RepoPath 'tools/Optimize-MyMix/18-settings-ui-fix.ps1')"
          if (-not $text.Contains($stage)) {
            if (-not $text.Contains($anchor)) { throw 'Optimizer startup-stage anchor was not found.' }
            $text = $text.Replace($anchor, $anchor + "`r`n" + $stage)
            [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))
          }

      - name: Apply settings display repair
        shell: powershell
        run: .\tools\Optimize-MyMix\18-settings-ui-fix.ps1

      - name: Validate repaired resources
        shell: powershell
        run: |
          [xml](Get-Content -LiteralPath '.\EarTrumpet\Properties\Resources.ja-JP.resx' -Raw) | Out-Null
          $optimizer = [IO.File]::ReadAllText('.\tools\Optimize-MyMix.ps1')
          if (-not $optimizer.Contains(". (Resolve-RepoPath 'tools/Optimize-MyMix/18-settings-ui-fix.ps1')")) { throw 'Repair stage was not wired into the optimizer.' }

      - name: Commit repaired generated sources
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/Optimize-MyMix.ps1 EarTrumpet/Properties/Resources.ja-JP.resx EarTrumpet/UI/Views/SettingsWindow.xaml
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Fix settings localization and volume-step presentation"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:fix/settings-display-labels
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
