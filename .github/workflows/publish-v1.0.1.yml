name: Publish MyMix v1.0.1

on:
  push:
    branches:
      - main
    paths:
      - 'EarTrumpet/Properties/AssemblyInfo.cs'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch validated v1.0.1 release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const file = await github.rest.repos.getContent({
              owner,
              repo,
              path: 'EarTrumpet/Properties/AssemblyInfo.cs',
              ref: 'main'
            });
            if (Array.isArray(file.data) || file.data.type !== 'file') {
              throw new Error('AssemblyInfo.cs could not be read.');
            }
            const assembly = Buffer.from(file.data.content, 'base64').toString('utf8');
            if (!assembly.includes('AssemblyVersion("1.0.1.0")')) {
              core.info('AssemblyVersion is not 1.0.1.0; no release dispatch required.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'release.yml',
              ref: 'main',
              inputs: { version: '1.0.1' }
            });
            core.info('Dispatched Release MyMix for v1.0.1.');
