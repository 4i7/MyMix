name: Release MyMix

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must match AssemblyVersion major.minor.patch)
        required: true
        default: '1.0.5'
        type: string
  push:
    branches:
      - main
    paths:
      - EarTrumpet/Properties/AssemblyInfo.cs

permissions:
  contents: write

concurrency:
  group: mymix-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: self-hosted
    env:
      RELEASE_VERSION: ${{ inputs.version || '1.0.5' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up NuGet
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0
        with:
          nuget-version: '7.9.0'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Validate release metadata and source invariants
        shell: powershell
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Release version must be numeric major.minor.patch.'
          }
          $assembly = [IO.File]::ReadAllText('.\EarTrumpet\Properties\AssemblyInfo.cs')
          $match = [regex]::Match($assembly, 'AssemblyVersion\("(\d+)\.(\d+)\.(\d+)\.\d+"\)')
          if (-not $match.Success) { throw 'AssemblyVersion was not found.' }
          $assemblyRelease = "$($match.Groups[1].Value).$($match.Groups[2].Value).$($match.Groups[3].Value)"
          if ($assemblyRelease -ne $env:RELEASE_VERSION) {
            throw "Release version $env:RELEASE_VERSION does not match AssemblyVersion $assemblyRelease."
          }
          .\tools\Test-MyMixRefactor.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $marker = [IO.File]::ReadAllText('.\.mymix-converted')
          if ($marker -notmatch '(?m)^upstream=File-New-Project/EarTrumpet@[0-9a-f]{40}$') {
            throw 'Recorded EarTrumpet upstream SHA was not found.'
          }

      - name: Prepare portable .NET Framework 4.6.2 reference assemblies
        shell: powershell
        run: |
          $cacheBase = if ($env:RUNNER_TOOL_CACHE) { Join-Path $env:RUNNER_TOOL_CACHE 'mymix-net462-refasm\1.0.3' } else { Join-Path $env:RUNNER_TEMP 'mymix-net462-refasm\1.0.3' }
          New-Item -ItemType Directory -Path $cacheBase -Force | Out-Null
          $packageRoot = Join-Path $cacheBase 'Microsoft.NETFramework.ReferenceAssemblies.net462'
          $mscorlib = Get-ChildItem $packageRoot -Recurse -Filter mscorlib.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $mscorlib) {
            Remove-Item $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
            nuget install Microsoft.NETFramework.ReferenceAssemblies.net462 -Version 1.0.3 -DirectDownload -ExcludeVersion -OutputDirectory $cacheBase
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $mscorlib = Get-ChildItem $packageRoot -Recurse -Filter mscorlib.dll | Select-Object -First 1
          }
          if (-not $mscorlib) { throw 'mscorlib.dll was not found in the net462 reference-assemblies cache.' }
          $frameworkVersionDir = $mscorlib.Directory.FullName
          $frameworkIdentifierDir = Split-Path $frameworkVersionDir -Parent
          $targetFrameworkRoot = (Split-Path $frameworkIdentifierDir -Parent) + '\'
          "MYMIX_TARGET_FRAMEWORK_ROOT=$targetFrameworkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Release x86
        shell: powershell
        run: |
          msbuild .\EarTrumpet\MyMix.csproj /m /p:Configuration=Release /p:Platform=x86 /p:TargetFrameworkRootPath="$env:MYMIX_TARGET_FRAMEWORK_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate event-driven watcher lifetime and races
        shell: powershell
        run: .\tools\Test-ProcessWatcherLifetime.ps1

      - name: Validate AppInfo cache and process-generation races
        shell: powershell
        run: .\tools\Test-AppInfoCacheLifetime.ps1

      - name: Smoke test MyMix startup
        shell: powershell
        run: .\tools\Smoke-TestMyMix.ps1

      - name: Stage release ZIP and checksum
        shell: powershell
        run: |
          $dist = Join-Path $env:RUNNER_TEMP "mymix-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          $payload = Join-Path $dist 'MyMix-x86'
          New-Item -ItemType Directory -Path $payload -Force | Out-Null

          foreach ($file in @('MyMix.exe', 'MyMix.exe.config')) {
            $source = Join-Path '.\Build\Release' $file
            if (-not (Test-Path -LiteralPath $source)) { throw "Required release file is missing: $source" }
            Copy-Item -LiteralPath $source -Destination $payload
          }
          if (Test-Path -LiteralPath '.\Build\Release\ja-JP\MyMix.resources.dll') {
            New-Item -ItemType Directory -Path (Join-Path $payload 'ja-JP') -Force | Out-Null
            Copy-Item -LiteralPath '.\Build\Release\ja-JP\MyMix.resources.dll' -Destination (Join-Path $payload 'ja-JP')
          }
          foreach ($doc in @('LICENSE', 'README.md', 'PRIVACY.md', 'THIRD_PARTY_NOTICES.md')) {
            Copy-Item -LiteralPath (Join-Path '.' $doc) -Destination $payload
          }

          $zip = Join-Path $dist 'MyMix-x86.zip'
          Compress-Archive -Path (Join-Path $payload '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MyMix-x86.zip" | Set-Content -LiteralPath (Join-Path $dist 'SHA256SUMS.txt') -Encoding ascii
          "MYMIX_RELEASE_DIST=$dist" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "MyMix-x86.zip SHA256: $hash"

      - name: Create or reuse draft release
        id: draft
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = `v${process.env.RELEASE_VERSION}`;
            const marker = fs.readFileSync('.mymix-converted', 'utf8');
            const upstream = marker.match(/^upstream=File-New-Project\/EarTrumpet@([0-9a-f]{40})$/m);
            if (!upstream) throw new Error('Recorded EarTrumpet upstream SHA was not found.');
            const body = [
              'MyMix is an independent, unofficial derivative of EarTrumpet.',
              '',
              'Changes in this release:',
              '- Fix the remaining pre-publication process-exit race where an already-exited candidate could briefly be published as Watching before the Exited event was delivered.',
              '- Fix AppInfo cache lifetime handling so PID reuse cannot reuse metadata from a different process generation.',
              '- Make process watcher publication, exit observation, and callback transfer generation-safe under races and access failures.',
              '- Add deterministic AppInfo/process-generation regression coverage and gate releases on those tests.',
              '- Apply the configured 1-10% volume step to mouse-wheel changes on in-window device/app sliders as well as the taskbar icon.',
              '- Keep the non-editable 1-10% slider, simplify its label, and remove redundant 1%/10% endpoint captions.',
              '- Remove the volume-step ComboBox path that could leak the settings-search placeholder into the control.',
              '- Keep the gentler logarithmic volume curve while preserving the existing display-domain volume path.',
              '- Event-driven process lifetime tracking removes the periodic process-watcher polling wake-up.',
              '- Optional hotkeys can toggle default-output mute and switch to the next playback device.',
              '- Windows sign-in startup remains explicitly opt-in.',
              '- Upstream regeneration preserves MyMix-specific release/startup metadata and rejects semantic drift.',
              '',
              `EarTrumpet upstream: \`${upstream[1]}\``,
              'Build: standalone Windows x86 / .NET Framework 4.6.2 target',
              'Privacy: no automatic telemetry, crash-report upload, or feedback upload',
              '',
              '**Unsigned binary:** Windows may show an unknown-publisher or SmartScreen warning.',
              'Verify `MyMix-x86.zip` against `SHA256SUMS.txt` from this release before running it.',
              '',
              'See the bundled `LICENSE`, `THIRD_PARTY_NOTICES.md`, and `PRIVACY.md` before redistribution or diagnostic sharing.'
            ].join('\n');

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              if (!release.draft) {
                core.setFailed(`${tag} is already published; refusing to overwrite it.`);
                return;
              }
              release = (await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, target_commitish: context.sha, name: `MyMix ${process.env.RELEASE_VERSION}`, body, draft: true, prerelease: false })).data;
            } catch (error) {
              if (error.status !== 404) throw error;

              // A deleted GitHub Release can leave its tag behind. If no release exists, repair
              // that orphaned tag before creating the new validated release so source and assets
              // always refer to the same commit.
              try {
                const existingRef = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data;
                if (existingRef.object.type !== 'commit') {
                  throw new Error(`${tag} is not a lightweight commit tag; refusing to retarget it automatically.`);
                }
                if (existingRef.object.sha !== context.sha) {
                  await github.rest.git.updateRef({ owner, repo, ref: `tags/${tag}`, sha: context.sha, force: true });
                }
              } catch (refError) {
                if (refError.status !== 404) throw refError;
              }

              release = (await github.rest.repos.createRelease({ owner, repo, tag_name: tag, target_commitish: context.sha, name: `MyMix ${process.env.RELEASE_VERSION}`, body, draft: true, prerelease: false })).data;
            }

            const finalRef = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data;
            if (finalRef.object.type !== 'commit' || finalRef.object.sha !== context.sha) {
              throw new Error(`${tag} does not point to the validated release commit ${context.sha}.`);
            }
            return String(release.id);

      - name: Upload release assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ steps.draft.outputs.result }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const release_id = Number(process.env.RELEASE_ID);
            if (!Number.isInteger(release_id)) throw new Error('Draft release ID is invalid.');
            const release = (await github.rest.repos.getRelease({ owner, repo, release_id })).data;
            if (!release.draft) throw new Error('Refusing to replace assets on a published release.');

            const existing = (await github.rest.repos.listReleaseAssets({ owner, repo, release_id, per_page: 100 })).data;
            for (const asset of existing) {
              if (asset.name === 'MyMix-x86.zip' || asset.name === 'SHA256SUMS.txt') await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }

            const uploadBase = release.upload_url.replace('{?name,label}', '');
            for (const [name, contentType] of [['MyMix-x86.zip', 'application/zip'], ['SHA256SUMS.txt', 'text/plain']]) {
              const file = path.join(process.env.MYMIX_RELEASE_DIST, name);
              const data = fs.readFileSync(file);
              const url = `${uploadBase}?name=${encodeURIComponent(name)}`;
              await github.request({ method: 'POST', url, headers: { 'content-type': contentType, 'content-length': data.length }, data });
            }

      - name: Publish validated release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ steps.draft.outputs.result }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const assets = (await github.rest.repos.listReleaseAssets({ owner, repo, release_id, per_page: 100 })).data;
            const names = new Set(assets.map(a => a.name));
            if (!names.has('MyMix-x86.zip') || !names.has('SHA256SUMS.txt')) throw new Error('Required release assets are missing; draft will not be published.');
            await github.rest.repos.updateRelease({ owner, repo, release_id, draft: false, prerelease: false });

      - name: Clean local release output
        if: always()
        shell: powershell
        run: |
          Remove-Item '.\Build' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item '.\EarTrumpet\obj' -Recurse -Force -ErrorAction SilentlyContinue
          if ($env:MYMIX_RELEASE_DIST) { Remove-Item $env:MYMIX_RELEASE_DIST -Recurse -Force -ErrorAction SilentlyContinue }

      - name: Summary
        if: always()
        shell: powershell
        run: |
          @(
            '## MyMix release',
            '',
            "Version: v$env:RELEASE_VERSION",
            'Distribution: GitHub Release assets',
            'GitHub Actions artifact/cache upload: disabled (0 bytes)',
            'Release requires source validation, Release/x86 compilation, process-watcher + AppInfo cache lifecycle/race validation, and startup smoke test before publication.'
          ) -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
