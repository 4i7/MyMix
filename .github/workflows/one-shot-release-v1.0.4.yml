name: One-shot prepare MyMix v1.0.4

on:
  push:
    branches:
      - release/v1.0.4

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Update release workflow metadata
        shell: powershell
        run: |
          $path = '.\.github\workflows\release.yml'
          $text = [IO.File]::ReadAllText($path)
          $text = $text.Replace("default: '1.0.3'", "default: '1.0.4'")
          $replacement = '      RELEASE_VERSION: $' + "{{ inputs.version || '1.0.4' }}"
          $text = [regex]::Replace($text, '(?m)^      RELEASE_VERSION: .+$', $replacement)
          $anchor = "              'Changes in this release:',"
          $bullet = "              '- Fix Japanese settings labels and the volume-step selector display on the mouse settings page.',"
          if (-not $text.Contains($bullet)) {
            if (-not $text.Contains($anchor)) { throw 'Release notes anchor not found.' }
            $text = $text.Replace($anchor, $anchor + "`r`n" + $bullet)
          }
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))

      - name: Validate release version wiring
        shell: powershell
        run: |
          $text = [IO.File]::ReadAllText('.\.github\workflows\release.yml')
          if (-not $text.Contains("default: '1.0.4'")) { throw 'Dispatch default was not updated.' }
          if (-not $text.Contains("inputs.version || '1.0.4'")) { throw 'Push fallback version was not updated.' }
          if (-not $text.Contains('Fix Japanese settings labels and the volume-step selector display')) { throw 'v1.0.4 release note was not added.' }

      - name: Commit release workflow update
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Prepare release workflow for v1.0.4"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:release/v1.0.4
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
