name: One-shot volume-step slider materialization

on:
  push:
    branches:
      - fix/volume-step-slider-v1.0.3
    paths:
      - .github/workflows/one-shot-volume-step-slider.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Materialize and validate slider sources
        shell: powershell
        run: .\tools\Materialize-VolumeStepSlider.ps1

      - name: Commit materialized slider sources
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EarTrumpet/AppSettings.cs EarTrumpet/UI/ViewModels/EarTrumpetMouseSettingsPageViewModel.cs EarTrumpet/UI/Views/SettingsWindow.xaml EarTrumpet/Properties/Resources.ja-JP.resx tools/Optimize-MyMix.ps1 tools/Test-MyMixRefactor.ps1
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Materialize 1-10 percent volume-step slider"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:fix/volume-step-slider-v1.0.3
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
