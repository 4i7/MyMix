name: Bootstrap source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract EarTrumpet source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f EarTrumpet-master.zip
          rm -rf .bootstrap-src
          mkdir .bootstrap-src
          unzip -q EarTrumpet-master.zip -d .bootstrap-src
          src="$(find .bootstrap-src -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$src"
          rsync -a "$src"/ ./ --exclude='.git/' --exclude='.github/workflows/bootstrap-source.yml'
          rm -rf .bootstrap-src EarTrumpet-master.zip
      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap EarTrumpet source for MyMix"
          git push
