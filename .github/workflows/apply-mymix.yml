name: Apply MyMix refactor

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-mymix.yml

permissions:
  contents: write

jobs:
  convert-build-commit:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Provide legacy master ref for upstream GitVersion
        shell: powershell
        run: git branch --force master HEAD

      - name: Convert source to MyMix
        shell: powershell
        run: .\tools\Convert-ToMyMix.ps1 -SkipBuild

      - name: Finalize standalone MyMix runtime
        shell: powershell
        run: .\tools\Finalize-StandaloneMyMix.ps1

      - name: Commit converted source
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No generated changes to commit."
          }
          else {
            git commit -m "Finalize standalone MyMix runtime"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Restore MyMix application packages
        shell: powershell
        run: |
          nuget restore .\EarTrumpet\MyMix.csproj -PackagesDirectory .\packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare portable .NET Framework 4.6.2 reference assemblies
        shell: powershell
        run: |
          Remove-Item .\refasm -Recurse -Force -ErrorAction SilentlyContinue
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net462 -Version 1.0.3 -DirectDownload -ExcludeVersion -OutputDirectory .\refasm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $packageRoot = (Resolve-Path '.\refasm\Microsoft.NETFramework.ReferenceAssemblies.net462').Path
          $mscorlib = Get-ChildItem $packageRoot -Recurse -Filter mscorlib.dll | Select-Object -First 1
          if (-not $mscorlib) { throw 'mscorlib.dll was not found in the net462 reference-assemblies package.' }

          $frameworkVersionDir = $mscorlib.Directory.FullName
          $frameworkIdentifierDir = Split-Path $frameworkVersionDir -Parent
          $targetFrameworkRoot = (Split-Path $frameworkIdentifierDir -Parent) + '\'
          Write-Host "Portable net462 reference assemblies: $frameworkVersionDir"
          Write-Host "TargetFrameworkRootPath: $targetFrameworkRoot"
          "MYMIX_TARGET_FRAMEWORK_ROOT=$targetFrameworkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate .NET Framework SDK assembly linker
        shell: powershell
        run: |
          $roots = @(
            "${env:ProgramFiles(x86)}\Microsoft SDKs\Windows",
            "${env:ProgramFiles(x86)}\Windows Kits",
            "$env:ProgramFiles\Microsoft SDKs\Windows",
            "$env:ProgramFiles\Windows Kits"
          ) | Where-Object { $_ -and (Test-Path $_) }

          $found = @()
          foreach ($root in $roots) {
            $found += Get-ChildItem -LiteralPath $root -Filter al.exe -File -Recurse -ErrorAction SilentlyContinue
          }

          $al = $found |
            Where-Object { $_.FullName -notmatch '\\x64\\' -and $_.FullName -notmatch '\\arm64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if ($al) {
            $sdkTools = $al.Directory.FullName + '\'
            Write-Host "Found al.exe: $($al.FullName)"
            Write-Host "TargetFrameworkSDKToolsDirectory: $sdkTools"
            "MYMIX_NETFX_SDK_TOOLS=$sdkTools" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          else {
            Write-Warning "al.exe was not found under the installed Microsoft SDK locations."
          }

      - name: Validate MyMix Release x86 application build
        shell: powershell
        run: |
          $arguments = @(
            '.\EarTrumpet\MyMix.csproj',
            '/m',
            '/p:Configuration=Release',
            '/p:Platform=x86',
            "/p:TargetFrameworkRootPath=$env:MYMIX_TARGET_FRAMEWORK_ROOT"
          )
          if ($env:MYMIX_NETFX_SDK_TOOLS) {
            $arguments += "/p:TargetFrameworkSDKToolsDirectory=$env:MYMIX_NETFX_SDK_TOOLS"
          }
          & msbuild @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
