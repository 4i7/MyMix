name: Apply MyMix refactor

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-mymix.yml

permissions:
  contents: write

jobs:
  convert-build-commit:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Provide legacy master ref for upstream GitVersion
        shell: powershell
        run: git branch --force master HEAD

      - name: Convert source to MyMix
        shell: powershell
        run: .\tools\Convert-ToMyMix.ps1 -SkipBuild

      - name: Commit converted source
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No generated changes to commit."
          }
          else {
            git commit -m "Apply MyMix refactor to EarTrumpet source"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Show installed .NET Framework reference assemblies
        shell: powershell
        run: |
          $root = "$env:ProgramFiles(x86)\Reference Assemblies\Microsoft\Framework\.NETFramework"
          if (Test-Path $root) {
            Get-ChildItem $root -Directory | Select-Object -ExpandProperty Name
          }
          else {
            Write-Warning ".NET Framework reference assembly directory is absent."
          }

      - name: Restore MyMix application packages
        shell: powershell
        run: |
          nuget restore .\EarTrumpet\MyMix.csproj -PackagesDirectory .\packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate MyMix Release x86 application build
        shell: powershell
        run: |
          msbuild .\EarTrumpet\MyMix.csproj /m /p:Configuration=Release /p:Platform=x86
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate package project when Desktop Bridge build tools are installed
        shell: powershell
        run: |
          $vswhere = "$env:ProgramFiles(x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -requires Microsoft.Component.MSBuild -property installationPath -latest
          $desktopBridge = Join-Path $installPath 'MSBuild\Microsoft\DesktopBridge\Microsoft.DesktopBridge.props'
          if (Test-Path $desktopBridge) {
            msbuild .\EarTrumpet.Package\MyMix.Package.wapproj /m /p:Configuration=Release /p:Platform=x86
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          else {
            Write-Warning "Desktop Bridge build tools are not installed; package-project validation is skipped. Install the Visual Studio WinUI/UWP application development build tools to enable it."
          }

# Retry marker: reference assemblies are restored from NuGet for net462.
