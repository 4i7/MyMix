name: Update MyMix from EarTrumpet

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: EarTrumpet branch, tag, or commit to import
        required: true
        default: master
        type: string
      force:
        description: Rebuild the MyMix patch even when the upstream SHA is unchanged
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-from-eartrumpet.yml
      - tools/Update-FromEarTrumpet.ps1
      - tools/Convert-ToMyMix.ps1
      - tools/Finalize-StandaloneMyMix.ps1
      - tools/Optimize-MyMix.ps1
      - tools/Test-MyMixRefactor.ps1
  schedule:
    # Monday 03:17 JST. A self-hosted runner can pick the job up when it is online.
    - cron: '17 18 * * 0'

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: mymix-eartrumpet-upstream
  cancel-in-progress: false

jobs:
  update-build-propose:
    runs-on: self-hosted
    env:
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'master' }}
      FORCE_SYNC: ${{ github.event_name == 'push' && 'true' || inputs.force || 'false' }}

    steps:
      - name: Purge stored Actions artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const artifact of artifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
            core.info(`Deleted ${artifacts.length} stored Actions artifact(s).`);

      - name: Checkout MyMix
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Import EarTrumpet and reapply MyMix patch
        id: sync
        shell: powershell
        run: |
          if ($env:FORCE_SYNC -eq 'true') {
            .\tools\Update-FromEarTrumpet.ps1 -UpstreamRef $env:UPSTREAM_REF -Force
          }
          else {
            .\tools\Update-FromEarTrumpet.ps1 -UpstreamRef $env:UPSTREAM_REF
          }

      - name: Prepare portable .NET Framework 4.6.2 reference assemblies
        if: steps.sync.outputs.changed == 'true'
        shell: powershell
        run: |
          $cacheBase = if ($env:RUNNER_TOOL_CACHE) {
            Join-Path $env:RUNNER_TOOL_CACHE 'mymix-net462-refasm\1.0.3'
          }
          else {
            Join-Path $env:RUNNER_TEMP 'mymix-net462-refasm\1.0.3'
          }
          New-Item -ItemType Directory -Path $cacheBase -Force | Out-Null

          $packageRoot = Join-Path $cacheBase 'Microsoft.NETFramework.ReferenceAssemblies.net462'
          $mscorlib = Get-ChildItem $packageRoot -Recurse -Filter mscorlib.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $mscorlib) {
            Remove-Item $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
            nuget install Microsoft.NETFramework.ReferenceAssemblies.net462 -Version 1.0.3 -DirectDownload -ExcludeVersion -OutputDirectory $cacheBase
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $mscorlib = Get-ChildItem $packageRoot -Recurse -Filter mscorlib.dll | Select-Object -First 1
          }
          if (-not $mscorlib) { throw 'mscorlib.dll was not found in the net462 reference-assemblies cache.' }

          $frameworkVersionDir = $mscorlib.Directory.FullName
          $frameworkIdentifierDir = Split-Path $frameworkVersionDir -Parent
          $targetFrameworkRoot = (Split-Path $frameworkIdentifierDir -Parent) + '\'
          Write-Host "Portable net462 reference assemblies: $frameworkVersionDir"
          "MYMIX_TARGET_FRAMEWORK_ROOT=$targetFrameworkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate MyMix Release x86 application build
        id: build
        if: steps.sync.outputs.changed == 'true'
        shell: powershell
        run: |
          msbuild .\EarTrumpet\MyMix.csproj /m /p:Configuration=Release /p:Platform=x86 /p:TargetFrameworkRootPath="$env:MYMIX_TARGET_FRAMEWORK_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove build-only files
        if: always() && steps.sync.outputs.changed == 'true'
        shell: powershell
        run: |
          foreach ($path in @('.\Build', '.\packages', '.\refasm', '.\EarTrumpet\obj')) {
            Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Commit transform-maintenance regeneration
        if: github.event_name == 'push' && steps.sync.outputs.changed == 'true' && steps.sync.outputs.upstream_changed != 'true'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Transform maintenance produced no source diff.'
          }
          else {
            git commit -m "Regenerate optimized MyMix after transform maintenance"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Commit validated update branch
        if: steps.sync.outputs.upstream_changed == 'true'
        id: publish
        shell: powershell
        env:
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          UPSTREAM_SHORT: ${{ steps.sync.outputs.upstream_short }}
        run: |
          $branch = "mymix/upstream-$env:UPSTREAM_SHORT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B $branch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            throw 'The upstream SHA changed, but the regenerated MyMix tree contains no source changes.'
          }

          git commit -m "Update MyMix from EarTrumpet $env:UPSTREAM_SHORT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push --force origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "branch=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Open or update MyMix upstream pull request
        if: steps.sync.outputs.upstream_changed == 'true'
        id: pr
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          UPDATE_BRANCH: ${{ steps.publish.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          UPSTREAM_REF: ${{ steps.sync.outputs.upstream_ref }}
        with:
          result-encoding: string
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = process.env.UPDATE_BRANCH;
            const existing = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${head}`, base: 'main', per_page: 10 });
            if (existing.data.length > 0) return existing.data[0].html_url;
            const shortSha = process.env.UPSTREAM_SHA.slice(0, 12);
            const created = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base: 'main',
              title: `Update MyMix from EarTrumpet ${shortSha}`,
              body: [
                'Automated EarTrumpet upstream refresh.',
                '',
                `Upstream ref: \`${process.env.UPSTREAM_REF}\``,
                `Upstream commit: \`${process.env.UPSTREAM_SHA}\``,
                '',
                'The MyMix conversion, standalone finalization, deep optimizer, static validation, and Release x86 build all passed on the self-hosted runner.',
                '',
                'No GitHub Actions artifact was uploaded; build validation is intentionally ephemeral to consume zero artifact-storage quota.',
                '',
                'Review upstream behavior/UI changes before merging this PR into `main`.'
              ].join('\n'),
            });
            return created.data.html_url;

      - name: Write update summary
        if: always()
        shell: powershell
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          CHANGED: ${{ steps.sync.outputs.changed }}
          UPSTREAM_CHANGED: ${{ steps.sync.outputs.upstream_changed }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          UPDATE_BRANCH: ${{ steps.publish.outputs.branch }}
          PR_URL: ${{ steps.pr.outputs.result }}
        run: |
          $lines = @('## MyMix upstream update', '', 'Actions artifact upload: disabled (0 bytes)')
          if ($env:SYNC_OUTCOME -ne 'success') {
            $lines += 'EarTrumpet import/MyMix conversion failed. No update branch was published.'
          }
          elseif ($env:CHANGED -ne 'true') {
            $lines += 'No new EarTrumpet commit was found for the requested ref.'
          }
          elseif ($env:BUILD_OUTCOME -ne 'success') {
            $lines += 'Release x86 build failed. No update was published.'
          }
          elseif ($env:UPSTREAM_CHANGED -ne 'true') {
            $lines += 'Forced clean regeneration passed at 30 FPS peak-meter configuration; transform-maintenance changes were committed only if a source diff existed.'
          }
          else {
            $lines += "EarTrumpet commit: ``$env:UPSTREAM_SHA``"
            $lines += "Validated branch: ``$env:UPDATE_BRANCH``"
            $lines += 'Release x86 build: passed'
            if ($env:PR_URL) { $lines += "Pull request: $env:PR_URL" }
            else { $lines += 'Pull request creation was unavailable; the validated branch was still pushed.' }
          }
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
